<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>ÄlykäsKalenteri</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calendar-box">
    <h1>ÄlykäsKalenteri</h1>
    <h3 id="clock"></h3>
    <button id="darkModeBtn">Dark Mode</button>
    <button id="clearBtn">Clear Events</button>
    <input type="text" id="searchInput" placeholder="Search event">
    <p>Älykäs kalenterisovellus, jossa voi lisätä, etsiä ja poistaa tapahtumia.</p>

    <div class="month-header">
      <button id="prevBtn">Edellinen</button>
       <h2 id="monthTitle">Huhtikuu 2026</h2>
      <button id="nextBtn">Seuraava</button>
    </div>

    <div class="weekdays">
      <div>Ma</div>
      <div>Ti</div>
      <div>Ke</div>
      <div>To</div>
      <div>Pe</div>
      <div>La</div>
      <div>Su</div>
    </div>


    <div class="days" id="daysBox">
      </div>
      </div>
  <footer>
  <p>© 2026 Sobia – ÄlykäsKalenteri</p>
</footer>
  <script src="script.js"></script>

</body>
</html>
